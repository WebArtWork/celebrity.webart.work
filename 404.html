<!doctype html>
<html lang="uk">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>404. Сторінку не знайдено</title>
  <meta name="robots" content="noindex, follow">
  <style>
    :root{--ink:#23262b;--muted:#5f6368;--paper:#faf7f1;--line:#dcd4c6;--accent:#7a2f3b}
    *{box-sizing:border-box}
    html,body{height:100%}
    body{margin:0;display:flex;align-items:center;justify-content:center;background:var(--paper);color:var(--ink);font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;line-height:1.6;padding:24px}
    a{color:var(--accent);text-decoration:none;font-weight:700}
    a:hover{text-decoration:underline}
    a:focus-visible{outline:3px solid var(--accent);outline-offset:3px}
    .box{max-width:480px;text-align:center}
    .code{font-size:.78rem;font-weight:800;letter-spacing:.18em;text-transform:uppercase;color:var(--muted);margin:0 0 18px}
    h1{font-size:clamp(3rem,9vw,4.5rem);line-height:1;margin:0 0 18px;letter-spacing:-.03em}
    p{color:var(--muted);margin:0 0 26px;font-size:1.02rem}
    .btn{display:inline-flex;align-items:center;justify-content:center;min-height:48px;padding:0 22px;border:1px solid var(--ink);border-radius:10px}
  </style>
</head>
<body>
  <div class="box">
    <p class="code">Помилка 404</p>
    <h1>Сторінку не знайдено</h1>
    <p>Можливо, посилання застаріло або адресу введено з помилкою.</p>
    <a class="btn" href="/">На головну</a>
  </div>
</body>
</html>
